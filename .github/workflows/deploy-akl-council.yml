name: Deploy — AKL Council Hub Network

on:
  push:
    branches:
      - main
    paths:
      - "akl-council/**"
      - ".github/workflows/deploy-akl-council.yml"
  pull_request:
    branches:
      - main
    paths:
      - "akl-council/**"
      - ".github/workflows/deploy-akl-council.yml"
  workflow_dispatch:

# Prevent concurrent runs against the same environment
concurrency:
  group: akl-council-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write      # OIDC token for Azure login
  contents: read
  pull-requests: write # Post plan output as PR comment

env:
  TF_WORKING_DIR: akl-council
  TF_VERSION: "1.11.1"
  # ARM_ vars are picked up automatically by the azurerm provider and backend
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  # ─── Plan ──────────────────────────────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: akl-council

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=akl-council/terraform.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan \
            -var-file="terraform.tfvars" \
            -var-file="firewall_rules.tfvars" \
            -out=tfplan \
            -detailed-exitcode \
            -no-color 2>&1 | tee plan_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          # exit 0 = no changes, exit 2 = changes present, exit 1 = error
          if [ $EXIT_CODE -eq 1 ]; then exit 1; fi
          echo "has_changes=$( [ $EXIT_CODE -eq 2 ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-akl-council
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

      - name: Post Plan Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const raw  = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8');
            const body = raw.length > 60000
              ? raw.slice(0, 60000) + '\n\n> Output truncated — see workflow logs for the full plan.'
              : raw;

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform Plan — \`akl-council\`\n\n\`\`\`\n${body}\n\`\`\``,
            });

  # ─── Apply ─────────────────────────────────────────────────────────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: akl-council
    needs: plan
    # Only runs on merges to main when the plan detected changes
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.plan.outputs.has_changes == 'true'

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=akl-council/terraform.tfstate"

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-akl-council
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
